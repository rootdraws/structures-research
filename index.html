:root{
  --bg:#F3F4F0; --panel:#FFFFFF; --ink:#15171A; --mute:#6A706C; --line:#D9DCD5; --soft:#E9EBE5;
  --acc:#B7800A; --acc-soft:#F4E6C4; --pos:#2E7A57; --neg:#B0432C; --warn:#9A6A00;
  --sans:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101211; --panel:#181B19; --ink:#E7E9E4; --mute:#8E948F; --line:#2B302D; --soft:#202421;
  --acc:#E3AE3F; --acc-soft:#3A2F16; --pos:#5CC08F; --neg:#E4745C; --warn:#E3AE3F;}}
:root[data-theme="dark"]{
  --bg:#101211; --panel:#181B19; --ink:#E7E9E4; --mute:#8E948F; --line:#2B302D; --soft:#202421;
  --acc:#E3AE3F; --acc-soft:#3A2F16; --pos:#5CC08F; --neg:#E4745C; --warn:#E3AE3F;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:14px;line-height:1.4;padding-inline:16px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px;border-bottom:1px solid var(--line);max-width:1240px;margin-inline:auto}
.brand{font-weight:800;letter-spacing:-.01em;font-size:16px}
.brand span{color:var(--acc)}
.sw{display:flex;gap:2px;flex-wrap:wrap}
.sw button{font-family:var(--mono);width:30px;height:28px;border-radius:4px;color:var(--mute)}
.sw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sw button:hover{color:var(--ink)}
.tg{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--mute)}
.tg button{width:34px;height:20px;border-radius:10px;background:var(--soft);border:1px solid var(--line);position:relative}
.tg button::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--mute);transition:transform .15s}
.tg button[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc)}
.tg button[aria-pressed="true"]::after{transform:translateX(14px);background:var(--acc)}
.dsel{display:flex;align-items:center;gap:2px;margin-left:auto;font-size:13px;color:var(--mute)}
.dsel span{margin-right:8px}
.dsel button{font-family:var(--mono);min-width:34px;height:26px;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
.dsel button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lname{font-size:12px;color:var(--mute);font-family:var(--mono)}
main{max-width:1240px;margin-inline:auto;padding-block:24px 64px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mute{color:var(--mute)} .acc{color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);white-space:nowrap}
.l1>*,.l4>*,.l8>*,.steps>*,.stack>*{min-width:0}
.chip{max-width:100%;white-space:normal}
.opt{max-width:100%}
.arrow{color:var(--mute);font-family:var(--mono);font-size:12px}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.big{font-family:var(--mono);font-weight:600;font-size:44px;letter-spacing:-.02em;line-height:1}
.src{border-bottom:1px dotted var(--mute);cursor:help}
.scroll{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 1 sidebar */
.l1{display:grid;grid-template-columns:250px 1fr;gap:28px}
.tree{font-size:13px}
.assets{display:flex;gap:4px;margin-bottom:16px}
.assets button{font-family:var(--mono);font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:4px;color:var(--mute)}
.assets button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tree .root{font-weight:800;font-size:18px;margin-bottom:10px}
.tree .dbt{margin-top:12px;font-weight:700;display:flex;justify-content:space-between}
.tree .br{display:flex;justify-content:space-between;width:100%;text-align:left;padding:5px 8px 5px 14px;border-left:1px solid var(--line);color:var(--mute)}
.tree .br:hover{color:var(--ink)}
.tree .br[aria-current="true"]{color:var(--ink);border-left:2px solid var(--acc);background:var(--panel)}
.ghosts{margin-top:26px;border-top:1px dashed var(--line);padding-top:10px}
.ghosts summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;color:var(--mute);font-size:12px}
.ghosts summary::-webkit-details-marker{display:none}
.ghosts summary>span:first-child::before{content:"+";display:inline-block;width:14px;font-family:var(--mono)}
.ghosts[open] summary>span:first-child::before{content:"−"}
.ghosts summary:hover{color:var(--ink)}
.ghosts .dbt,.ghosts .br>span{opacity:.35}
.ghosts .br{border-left-style:dashed}
.ghosts .br .num{color:var(--mute)}
.ghosts .br .num.neg{color:var(--neg);opacity:.55}
.ghosts .br:hover>span,.ghosts .br[aria-current="true"]>span{opacity:.7}
.detail{display:grid;gap:22px;align-content:start}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kv div{background:var(--panel);padding:12px}
.kv b{display:block;font-family:var(--mono);font-size:18px;font-weight:600;margin-top:4px}
.legs{display:grid;gap:6px}
.leg{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar{height:10px;position:relative;background:var(--soft)}
.bar i{position:absolute;top:0;bottom:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right}
@media (max-width:760px){.l1{grid-template-columns:1fr}.big{font-size:34px}}

/* 4 builder */
.steps{display:grid;gap:18px}
.step .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-size:13px;text-align:left}
.opt small{display:block;font-family:var(--mono);color:var(--mute);font-size:11px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt:disabled{opacity:.35;cursor:not-allowed}
.opt:disabled[aria-pressed="true"]{opacity:1;cursor:default}
.l4{display:grid;grid-template-columns:1.1fr .9fr;gap:36px}
.stack{display:grid;gap:4px;align-content:start}
.srow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.srow.tot{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;font-size:15px}
.sleeves{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px}
.sleeves input{width:60px;font:inherit;font-family:var(--mono);padding:4px 6px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px}
@media (max-width:760px){.l4{grid-template-columns:1fr}}

.note{border:1px solid var(--line);border-left:4px solid var(--c);background:var(--panel);padding:12px 14px;margin-bottom:22px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px}
.note span{color:var(--mute)}
.note.flag{margin:0;font-weight:400}
.note.dial{display:grid;gap:8px;margin-bottom:0}
.note.dial p{margin:0}
.note.dial a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.note.flag b{font-weight:500}
.z-g,.z-t-g{--c:var(--pos)} .z-y,.z-t-y{--c:var(--warn)} .z-r,.z-t-r{--c:var(--neg)}
.z-t-g,.z-t-y,.z-t-r{color:var(--c)}
.ltvrow{display:flex;align-items:center;gap:14px;margin-top:10px}
.ltvrow input{flex:1;accent-color:var(--ink)}
.ltvrow b{font-size:20px;min-width:64px;text-align:right}
.zbar{position:relative;display:flex;height:8px;margin-top:10px}
.zbar i{display:block;height:100%}
.zg{background:var(--pos)} .zy{background:var(--warn)} .zr{background:var(--neg)}
.zmark{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);transform:translateX(-1px)}
.zlab{position:relative;height:16px;font-size:11px;color:var(--mute);margin-top:4px}
.zlab span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.zlab span:first-child{transform:none;left:0}
.zlab span:last-child{transform:translateX(-100%)}
.zone{margin-top:8px;font-size:13px}

/* 6 terminal */

/* 2 flow */
svg text{font-family:var(--mono);fill:var(--ink)}
svg .m{fill:var(--mute)}
.node{cursor:pointer}
.vizwrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
.below{margin-top:18px}

</style>

  <div><span class="lbl">Margin value</span><b>${Math.round((b.inputs.haircut??0.9)*100)}%</b><span class="mute" style="font-size:12px">Aster haircut on ${D.collateral.name}</span></div>
  <div><span class="lbl">Ceiling</span><b>${usd(c.bind.usd)}</b><span class="mute" style="font-size:12px">${c.bind.name}</span></div>
  <div><span class="lbl">Long / short</span><b>1.00× / ${c.Sh.toFixed(2)}×</b><span class="mute" style="font-size:12px">delta ${st.delta}</span></div>
  </div>`;
  return `<div class="kv">
  <div><span class="lbl">Borrow</span><b>${d.rate.toFixed(2)}%</b><span class="mute" style="font-size:12px">${d.flat?`flat rate, today`:`${d.venue}, today`}</span></div>
  <div><span class="lbl">Funding</span><b title="${fundTip(b)}">${b.funding.apr.toFixed(2)}%</b><span class="mute" style="font-size:12px">longs paid ${b.funding.longs_pay}%</span></div>
  <div><span class="lbl">Liquidates</span><b class="z-t-${c.zone}">-${pc1(c.buf)}</b><span class="mute" style="font-size:12px">at ${pc1(c.V)} LTV</span></div>
  <div><span class="lbl">Ceiling</span><b>${usd(c.bind.usd)}</b><span class="mute" style="font-size:12px">${c.bind.name}</span></div>
  <div><span class="lbl">Long / short</span><b>${c.C.toFixed(2)}× / ${c.Sh.toFixed(2)}×</b><span class="mute" style="font-size:12px">delta ${st.delta}, ${D.model.hedge_lev}× hedge</span></div>
  </div>`}
function legList(b){
  const ids=[...b.legs,...b.loop,...(b.exit||[])];
  const seen=new Set();
  return `<table class="tbl"><thead><tr><th>Leg</th><th>Where</th><th class="r">Clears in 1%</th><th class="r">Per day</th></tr></thead><tbody>${ids.filter(i=>!seen.has(i)&&seen.add(i)).map(i=>{const l=ALL.legs[i];
    const clears=l.depth1!=null?usd(l.depth1):l.seconds!=null?`${l.seconds}s · ${l.bps}bp`:"unlimited";
    return `<tr><td>${l.label}${(b.exit||[]).includes(i)?' <span class="mute">exit</span>':b.loop.includes(i)&&!b.legs.includes(i)?' <span class="mute">loop</span>':''}</td><td class="mute">${l.pool||l.bridge}</td><td class="r num">${clears}</td><td class="r num">${l.per_day?usd(l.per_day):l.back?`back ${l.back.seconds}s`:"—"}</td></tr>`}).join("")}</tbody></table>`;
}

const LAYOUTS = {
1:["Sidebar",()=>{const b=by(st.sel);
  const assets=`<div class="assets" role="group" aria-label="Collateral">${Object.keys(ALL.assets).map(a=>`<button data-asset="${a}" aria-pressed="${a===st.asset}">${a}</button>`).join("")}</div>`;
  if(!b) return `<div class="l1"><nav class="tree">${assets}${ghostsHTML(b)}</nav><section class="detail">${D.collateral.note?`<div class="note z-y flag"><b>${D.collateral.note}</b></div>`:""}<div class="note z-y flag"><b>No ${D.collateral.name} route clears ${fl()} with a $${D.model.min_ceiling/1000}k ceiling at this setting.</b></div></section></div>`;
  return `<div class="l1"><nav class="tree">${assets}<div class="root">${D.collateral.name} <span class="mute num" style="font-size:12px;font-weight:400">${D.collateral.yield_label}</span></div>
  ${DEBTS.filter(dn=>VB().some(x=>x.debt===dn)).map(dn=>{const d=debt(dn);return `<div class="dbt"><span>${dn}</span><span class="mute num" style="font-weight:400">${d.rate.toFixed(2)}%</span></div>
  ${VB().filter(x=>x.debt===dn).map(x=>`<button class="br" data-sel="${x.id}" aria-current="${x.id===b.id}"><span>${x.title}</span><span class="num ${cls(net(x))}">${pct(net(x),1)}</span></button>`).join("")}`}).join("")}${+st.delta===1||!VB().some(x=>x.kind==="raw")?"":`<div class="dbt sub" style="margin-top:22px;flex-direction:column;align-items:flex-start;gap:2px"><span>${D.collateral.name} on Aster</span><span class="mute" style="font-weight:400;font-size:11px">no borrow | variable hedge on</span></div>`}
  ${VB().filter(x=>x.kind==="raw").map(x=>`<button class="br" data-sel="${x.id}" aria-current="${x.id===b.id}"><span>${x.title}</span><span class="num ${cls(net(x))}">${pct(net(x),1)}</span></button>`).join("")}${ghostsHTML(b)}</nav>
  <section class="detail">${D.collateral.note?`<div class="note z-y flag"><b>${D.collateral.note}</b></div>`:""}${shown(b)?"":`<div class="note z-y flag"><b>Beneath the ${net(b)>D.collateral.floor?`$${D.model.min_ceiling/1000}k ceiling`:`${fl()}`} floor.</b></div>`}${dialOn(b)?`<div class="note z-y flag dial"><p><b>Variable hedge.</b> After a sudden burst of forced selling, drop the short for ${S.dial_hours} hour${S.dial_hours>1?"s":""}, then put it back.</p><p>${D.hedge} usually bounces: a median +${S.dial_edge.toFixed(2)}% over that time, against +${S.dial_control.toFixed(2)}% after random minutes. Last year this added +${S.dial_equity}% over ${S.dial_trades} trades. The worst trade lost ${Math.abs(S.dial_worst)}%.</p><p class="neg">On ${fmtDay(D.risk.fastest.m1.day)} the selling didn't stop: ${D.hedge} fell ${pc1(D.risk.fastest.m1.fall)} in one minute. A dropped short would have been fully long into it.</p><p class="mute" style="font-size:12px">Why ${S.dial_hours}h: best trailing year among cut lengths whose worst rolling year is at least as good as 12h's. ${D.dial_table.map(r=>`${r.hours}h ${r.trailing>0?"+":""}${r.trailing.toFixed(1)}% (worst year ${r.worst_window>0?"+":""}${r.worst_window.toFixed(1)}%)`).join(" · ")}. Net of funding, 1.174× short; source: <code>bin/dial_backtest.py</code> on Binance 1m and Hyperliquid funding, ${S.dial_trades} trades in the last 365 days.</p></div>`:""}${b.kind==="raw"?"":noteHTML(b)}<div><div class="lbl">${b.debt} · ${b.title}</div><div class="big ${cls(net(b))}" style="margin-top:8px">${pct(net(b))}</div></div>
  ${pathHTML(b)}${b.kind==="raw"?"":ltvHTML(b)}<div class="legs">${legBars(b)}</div>${kv(b)}${b.flag?`<div class="note z-y flag"><b>${b.flag}</b></div>`:""}<div class="scroll">${legList(b)}</div>
  ${b.deps.length?`<div class="path"><span class="lbl">Depends on</span>${b.deps.map(x=>`<span class="chip">${x}</span>`).join("")}</div>`:""}</section></div>`}],

};

function render(){
  if(!LAYOUTS[st.layout]) st.layout=1;
  document.getElementById("dialbtn").setAttribute("aria-pressed",st.dial);
  document.querySelectorAll("[data-delta]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.delta===+st.delta));
  document.getElementById("app").innerHTML=LAYOUTS[st.layout][1]();
  save();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-asset],[data-sel],[data-b],[data-dial],[data-slide],[data-delta],#dialbtn");
  if(!t) return;
  if(t.dataset.delta!=null){st.delta=+t.dataset.delta}
  else if(t.id==="dialbtn"||t.dataset.dial){st.dial=!st.dial}
  else if(t.dataset.asset){st.asset=t.dataset.asset;useAsset(st.asset);st.sel=null}
  else if(t.dataset.sel){st.sel=t.dataset.sel}
  else if(t.dataset.b){st.b[t.dataset.b]=t.dataset.v}
  else if(t.dataset.slide){st.slide=(st.slide|0)+(+t.dataset.slide)}
  render();
});
document.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("ghosts")){st.ghosts=e.target.open;save()}},true);
document.addEventListener("input",e=>{if(e.target.id==="ltvg"){st.ltvBy[e.target.dataset.debt]=+e.target.value;render();const i=document.getElementById("ltvg");i&&i.focus();return}if(e.target.id==="sl"){st.b.sleeves=+e.target.value;render();const i=document.getElementById("sl");i.focus();i.setSelectionRange?.(9,9)}});
render();
</script>

</body>
</html>
